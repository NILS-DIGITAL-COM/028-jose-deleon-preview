{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How much does a wedding cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each package has a starting price. Compare the packages, then request pricing for your date."
      }
    },
    {
      "@type": "Question",
      "name": "Can we tour the estate first?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, in person or by video call. Schedule a tour."
      }
    },
    {
      "@type": "Question",
      "name": "Until what time can the music play?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Music ends at 10 PM. Quiet hours run from 10 PM to 8 AM."
      }
    },
    {
      "@type": "Question",
      "name": "Where can we hold the ceremony?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On the oak lawn, the pond dock, at the front arches or in the fountain courtyard. See the layouts."
      }
    },
    {
      "@type": "Question",
      "name": "Can we use fireworks, confetti or sparklers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No fireworks, confetti or glitter."
      }
    },
    {
      "@type": "Question",
      "name": "How many guests can stay the night?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Up to 32, in six bedrooms and a bunk room, with 18 beds and 5.5 baths."
      }
    },
    {
      "@type": "Question",
      "name": "When can we check in?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "From 4 PM, with self check-in. Every guest signs an Innkeeper Agreement before check-in."
      }
    },
    {
      "@type": "Question",
      "name": "Can the pool be heated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, for $45 a day, with a day’s notice."
      }
    },
    {
      "@type": "Question",
      "name": "Can we bring pets?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Up to 2 pets, $150 per pet, with notice."
      }
    },
    {
      "@type": "Question",
      "name": "How far is the airport?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "15 minutes to Palm Beach International (PBI) and to the beach."
      }
    },
    {
      "@type": "Question",
      "name": "Can we bring our own vendors?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Tell us who is coming and we approve them ahead of the day."
      }
    },
    {
      "@type": "Question",
      "name": "How much parking is there?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Up to 10 cars, more with approval. RV parking with notice."
      }
    },
    {
      "@type": "Question",
      "name": "Does every event need approval?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Every event is approved in writing before you book."
      }
    }
  ]
}
