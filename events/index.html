<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How much does an event cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature Celebrations start at $6,500, private gatherings at $500, Celebration Hall events at $1,200 and outdoor ceremonies and celebrations at $2,500. Photoshoots start at $500. The fee depends on the space, the date and your attendance. See every price, or send us your date and we’ll reply with a quote."
      }
    },
    {
      "@type": "Question",
      "name": "Can our guests stay overnight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, up to 32 guests. Lodging is priced separately. Signature lodging rate includes up to 24 overnight guests; guests 25–32 are $25 per person per night (32 maximum)."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a minimum stay?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For a Signature Celebration, by celebration date: Monday–Thursday, 2 nights (one night only by written management exception; Thursday subject to scheduling approval); Friday–Sunday, 3 nights. Outdoor ceremonies and celebrations: Regular house minimum stay applies."
      }
    },
    {
      "@type": "Question",
      "name": "Are taxes included?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Rates exclude applicable taxes, itemized at booking."
      }
    },
    {
      "@type": "Question",
      "name": "How many guests can attend?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature Celebrations: Event fee includes up to 100 attendees. Attendance above 100 requires prior written approval. Each other option’s price table shows its attendee tiers. Event attendance above published limits is never automatically authorized. Up to 32 guests can stay overnight."
      }
    },
    {
      "@type": "Question",
      "name": "What’s included?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on the event option. Signature Celebrations: Celebration Hall and approved outdoor ceremony lawn; standard tables and chairs for approved attendees; portable bar station, buffet tables, parking direction attendant (not valet), standard venue cleaning and trash trailer. See what each option includes."
      }
    },
    {
      "@type": "Question",
      "name": "What are the event hours?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature Celebrations: Access and vendor schedules are confirmed in writing; event access ends no later than midnight. Celebration Hall events: Includes six consecutive hours for setup, celebration and departure; all use ends by 10 PM. Outdoor ceremonies and celebrations: Includes up to four consecutive hours of reserved outdoor access, including setup, event and departure."
      }
    },
    {
      "@type": "Question",
      "name": "Can we bring outside vendors?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. All event spaces, guest counts, vendor plans and schedules require written approval. Alcohol service requires approval."
      }
    },
    {
      "@type": "Question",
      "name": "What about decorations and cleanup?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Guests/vendors remove décor and catering waste; no glitter, confetti or loose artificial petals."
      }
    },
    {
      "@type": "Question",
      "name": "Is there parking?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature Celebrations include a parking direction attendant. It is not a valet service."
      }
    },
    {
      "@type": "Question",
      "name": "Can we tour the estate first?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Choose a tour in the form, in person or by video call, and we’ll confirm a time with you."
      }
    },
    {
      "@type": "Question",
      "name": "How do we book and pay?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Direct event bookings: 25% of event fee at confirmation, 25% at 60 days out and final 50% at 30 days out."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a security deposit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Refundable security: $1,000 per event or $500 per photoshoot when permitted by booking channel."
      }
    },
    {
      "@type": "Question",
      "name": "What if we need to cancel?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Direct-event cancellation charges: more than 60 days, 25%; 31–60 days, 50%; within 30 days, 100%, under the confirmed agreement. Lodging has separate payment/cancellation terms; Airbnb and Vrbo reservations follow applicable platform rules."
      }
    }
  ]
}
</script>
