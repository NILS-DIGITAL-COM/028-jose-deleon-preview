<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How much does an event cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature event + stay packages start at $6,500, with two nights in the house included. One-day rentals without a stay: the Hall from $3,800 and the grounds from $2,800. The price depends on the space, the day of the week and your attendance, not on what you are celebrating. See every price, or send us your date and we’ll reply with a quote."
      }
    },
    {
      "@type": "Question",
      "name": "Can our guests stay overnight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Every Signature package includes the house for two nights. Two nights are included. Check-in date determines the minimum stay; Thursday, Friday, and Saturday check-ins require at least two nights. Additional nights: $1,500 per night for up to 25 overnight guests."
      }
    },
    {
      "@type": "Question",
      "name": "Are taxes included?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. All prices exclude applicable taxes. Taxes required by law will be calculated and itemized at booking. Airbnb and Vrbo bookings follow the payment and cancellation terms disclosed on the applicable platform."
      }
    },
    {
      "@type": "Question",
      "name": "How many guests can attend?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature packages cover up to 100 attendees. $6,500 Sunday–Thursday or $8,000 Friday–Saturday covers up to 100 people. Only attendees above 100 add $35 per person, subject to prior approval. Example: 125 people adds $875. Hall day rental: Tables and chairs included. Maximum 75 people. Eight hours total, including setup and cleanup; event ends by 10:00 PM. Outdoor-only day rental: Tables and chairs included. Maximum 50 people. Eight hours total, including setup and cleanup; event ends by 10:00 PM. More than 50 requires Outdoor Signature."
      }
    },
    {
      "@type": "Question",
      "name": "What’s included?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature packages: Premium tables and chairs for up to 100, including gold Chiavari chairs; one portable bar; two buffet tables; and two half-moon tables. Client vendors handle setup and breakdown. See what each option includes."
      }
    },
    {
      "@type": "Question",
      "name": "What are the event hours?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signature packages: Exclusive access to the selected event areas from 8:00 AM to 10:00 PM, including vendor setup and breakdown. Event activity ends by 10:00 PM."
      }
    },
    {
      "@type": "Question",
      "name": "Can we bring our own vendors?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Your vendors handle setup and breakdown. Independent event planners and coordinators are available through our preferred vendor list. Services are optional, contracted separately, and paid directly to the planner. The selected planner may attend the complimentary walkthrough. Pricing is quoted by the planner."
      }
    },
    {
      "@type": "Question",
      "name": "Can we have a dinner at the house?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A private dinner inside the house for registered overnight guests only, within the lodging occupancy limit. No outside invitees and no Hall or grounds access."
      }
    },
    {
      "@type": "Question",
      "name": "Can we tour the estate first?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Choose a tour in the form, in person or by video call, and we’ll confirm a time with you."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a planning walkthrough?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "One complimentary 90-minute planning walkthrough 30–60 days before the event, Monday–Thursday daytime, subject to property availability. The couple, planner, and essential vendors may attend one combined appointment. No setup, deliveries, decorating, or storage. If advance access is unavailable, a video walkthrough or meeting after check-in may be arranged."
      }
    },
    {
      "@type": "Question",
      "name": "How do we book and pay?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "At booking: 25% of the event fee.; 30 days after booking: Another 25%. If this falls after the 30-day-before-event deadline, it is accelerated to that deadline.; 30 days before event: Remaining 50%; full event fee due by this date. Bookings made within 30 days require full payment at booking."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a security deposit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. A $1,000 refundable event security deposit is separate and returned after inspection, less documented deductions authorized by the agreement."
      }
    },
    {
      "@type": "Question",
      "name": "What if we need to cancel?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Within 10 calendar days of booking, and more than 30 days before event: 0%; refund event payments received.; More than 60 days before event, after the 10-day window: 25% of the event fee.; 31–60 days before event: 50% of the event fee.; 30 days or fewer before event: 100% of the event fee. The 10-day refund window does not apply to bookings made within 30 days. Payments already received count toward the applicable cancellation amount. Refund any excess; collect only a shortfall up to that cancellation amount. Lodging cancellation terms are separate."
      }
    }
  ]
}
</script>
